<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181c" />
      <stop offset="50%" stop-color="#111114" />
      <stop offset="100%" stop-color="#08080a" />
    </linearGradient>

    <!-- Outer Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b47" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#e50914" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ff7b84" stop-opacity="0.75" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Primary Cinema Red Gradient -->
    <linearGradient id="redGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3844" />
      <stop offset="100%" stop-color="#b80610" />
    </linearGradient>

    <linearGradient id="redGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff525d" />
      <stop offset="100%" stop-color="#d10712" />
    </linearGradient>

    <!-- Play Arrow Highlight Gradient -->
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#ffc837" />
      <stop offset="100%" stop-color="#ff3844" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="8" y="8" width="184" height="184" rx="44" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3" />

  <!-- Subtle Film Sprocket Accents (Top & Bottom) -->
  <rect x="42" y="22" width="16" height="8" rx="3" fill="#ffffff" fill-opacity="0.08" />
  <rect x="68" y="22" width="16" height="8" rx="3" fill="#ffffff" fill-opacity="0.08" />
  <rect x="116" y="22" width="16" height="8" rx="3" fill="#ffffff" fill-opacity="0.08" />
  <rect x="142" y="22" width="16" height="8" rx="3" fill="#ffffff" fill-opacity="0.08" />

  <rect x="42" y="170" width="16" height="8" rx="3" fill="#ffffff" fill-opacity="0.08" />
  <rect x="68" y="170" width="16" height="8" rx="3" fill="#ffffff" fill-opacity="0.08" />
  <rect x="116" y="170" width="16" height="8" rx="3" fill="#ffffff" fill-opacity="0.08" />
  <rect x="142" y="170" width="16" height="8" rx="3" fill="#ffffff" fill-opacity="0.08" />

  <!-- Glowing Emblem Group -->
  <g filter="url(#neonGlow)">
    <!-- Left Wing of 'M' -->
    <path d="M 46 148 L 46 62 C 46 56 52 52 58 55 L 86 73 C 90 75 92 80 92 85 L 92 148 C 92 153 86 156 81 153 L 53 153 C 49 153 46 151 46 148 Z"
          fill="url(#redGrad1)" />

    <!-- Right Wing of 'M' -->
    <path d="M 154 148 L 154 62 C 154 56 148 52 142 55 L 114 73 C 110 75 108 80 108 85 L 108 148 C 108 153 114 156 119 153 L 147 153 C 151 153 154 151 154 148 Z"
          fill="url(#redGrad2)" />

    <!-- Central Cinematic Play Symbol (Forward Momentum) -->
    <polygon points="86,76 132,104 86,132"
             fill="url(#playGrad)"
             opacity="0.95" />

    <!-- Center Cutout / Depth -->
    <circle cx="98" cy="104" r="6" fill="#111114" opacity="0.6" />
  </g>

  <!-- Golden Specular Star Flare on Play Button Peak -->
  <circle cx="132" cy="104" r="3.5" fill="#ffffff" />
  <circle cx="132" cy="104" r="7" fill="#ffcc00" fill-opacity="0.4" />
</svg>
